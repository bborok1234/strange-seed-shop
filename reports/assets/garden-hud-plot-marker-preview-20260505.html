<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garden HUD Plot Marker Preview — 2026-05-05</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #21342b;
        --muted: #617064;
        --stage: #cfe7b9;
        --soil: #8b5c35;
        --panel: rgba(255, 255, 255, 0.78);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #edf5e7;
        color: var(--ink);
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 24px auto;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        color: var(--muted);
        margin-top: 8px;
      }

      .stage {
        margin-top: 20px;
        min-height: 430px;
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 245, 177, 0.55), transparent 32%),
          linear-gradient(180deg, #ddf1ca 0%, var(--stage) 55%, #b4d794 100%);
        border: 1px solid rgba(91, 119, 78, 0.28);
        position: relative;
        overflow: hidden;
        padding: 32px;
      }

      .garden-line {
        position: absolute;
        inset: auto 6% 16% 6%;
        height: 92px;
        border-radius: 999px;
        background: rgba(87, 55, 29, 0.18);
      }

      .plot-grid {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
        align-items: end;
        padding-top: 120px;
      }

      .plot {
        min-height: 210px;
        display: grid;
        place-items: center;
        position: relative;
      }

      .plot img.seedbed {
        width: min(100%, 300px);
        height: auto;
        display: block;
        filter: drop-shadow(0 12px 18px rgba(48, 61, 37, 0.22));
      }

      .label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -42%);
        width: min(62%, 190px);
        min-height: 48px;
        display: grid;
        place-items: center;
        text-align: center;
        font-weight: 800;
        font-size: 18px;
        line-height: 1.15;
        color: #1f3728;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
        pointer-events: none;
      }

      .plate {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -42%);
        width: min(70%, 210px);
        opacity: 0.86;
        pointer-events: none;
      }

      .ribbon {
        position: absolute;
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        width: min(76%, 230px);
        filter: drop-shadow(0 8px 12px rgba(91, 76, 18, 0.18));
        pointer-events: none;
      }

      .contact {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      figure {
        margin: 0;
        padding: 12px;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid rgba(75, 99, 65, 0.2);
      }

      figure img {
        width: 100%;
        height: 130px;
        object-fit: contain;
        display: block;
      }

      figcaption {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Garden HUD Plot Marker Preview</h1>
      <p>PR1 candidate composition only. Manifest/runtime acceptance waits for PR2 GardenPlotCard screenshots.</p>
      <section class="stage" aria-label="plot marker candidate composition">
        <div class="garden-line"></div>
        <div class="plot-grid">
          <div class="plot">
            <img class="seedbed" alt="" src="../../public/assets/game/ui/ui_hud_plot_seedbed_empty_001.png" />
            <img class="plate" alt="" src="../../public/assets/game/ui/ui_hud_plot_text_plate_001.png" />
            <div class="label">빈 자리</div>
          </div>
          <div class="plot">
            <img class="seedbed" alt="" src="../../public/assets/game/ui/ui_hud_plot_seedbed_growing_001.png" />
            <img class="plate" alt="" src="../../public/assets/game/ui/ui_hud_plot_text_plate_001.png" />
            <div class="label">성장 64%</div>
          </div>
          <div class="plot">
            <img class="seedbed" alt="" src="../../public/assets/game/ui/ui_hud_plot_seedbed_growing_001.png" />
            <img class="ribbon" alt="" src="../../public/assets/game/ui/ui_hud_plot_ready_ribbon_001.png" />
            <img class="plate" alt="" src="../../public/assets/game/ui/ui_hud_plot_text_plate_001.png" />
            <div class="label">수확!</div>
          </div>
        </div>
      </section>
      <section class="contact" aria-label="candidate contact sheet">
        <figure>
          <img alt="" src="../../public/assets/game/ui/ui_hud_plot_seedbed_empty_001.png" />
          <figcaption>ui_hud_plot_seedbed_empty_001</figcaption>
        </figure>
        <figure>
          <img alt="" src="../../public/assets/game/ui/ui_hud_plot_seedbed_growing_001.png" />
          <figcaption>ui_hud_plot_seedbed_growing_001</figcaption>
        </figure>
        <figure>
          <img alt="" src="../../public/assets/game/ui/ui_hud_plot_ready_ribbon_001.png" />
          <figcaption>ui_hud_plot_ready_ribbon_001</figcaption>
        </figure>
        <figure>
          <img alt="" src="../../public/assets/game/ui/ui_hud_plot_text_plate_001.png" />
          <figcaption>ui_hud_plot_text_plate_001</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
